<h2>{{ isEditMode ? 'Edit User' : 'Add User' }}</h2>
<form [formGroup]="userForm" (ngSubmit)="submit()">

  <label>Name</label>
  <input type="text" formControlName="name">
  <div *ngIf="userForm.get('name')?.touched && userForm.get('name')?.invalid">
    Name is required
  </div>

  <label>Email</label>
  <input type="email" formControlName="emailId">
  <div *ngIf="userForm.get('emailId')?.touched && userForm.get('emailId')?.invalid">
    Enter valid email
  </div>

  <label>Contact Number</label>
  <input type="text" formControlName="contactNumber">

  <label>Role</label>
  <select formControlName="role">
    <option *ngFor="let role of roles" [value]="role">
      {{ role }}
    </option>
  </select>

  <button type="submit" [disabled]="userForm.invalid">
    {{ isEditMode ? 'Update' : 'Save' }}
  </button>

</form>
