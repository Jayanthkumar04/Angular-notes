<div class="container" style="margin-top:100px">


<form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()" class="container mt-4">
    <h3 class="mb-3">Account Info</h3>
  
    <div class="mb-3">
      <label for="name" class="form-label">Full Name</label>
      <input id="name" class="form-control" formControlName="name" placeholder="Full Name" />
    </div>
  
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input id="email" class="form-control" formControlName="email" placeholder="Email" />
    </div>
  
    <div class="mb-3">
      <label for="phone" class="form-label">Phone Number</label>
      <input id="phone" class="form-control" formControlName="phone" placeholder="Phone Number" />
    </div>
  
    <h3 class="mt-4 mb-3">Shipping Address</h3>
  
    <div class="mb-3">
      <label for="houseNum" class="form-label">House Number</label>
      <input id="houseNum" class="form-control" formControlName="houseNum" placeholder="House Number" />
    </div>
  
    <div class="mb-3">
      <label for="street" class="form-label">Street</label>
      <input id="street" class="form-control" formControlName="street" placeholder="Street" />
    </div>
  
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="city" class="form-label">City</label>
        <input id="city" class="form-control" formControlName="city" placeholder="City" />
      </div>
      <div class="col-md-6 mb-3">
        <label for="state" class="form-label">State</label>
        <input id="state" class="form-control" formControlName="state" placeholder="State" />
      </div>
    </div>
  
    <div class="row">
      <div class="col-md-6 mb-3">
        <label for="zip" class="form-label">Zipcode</label>
        <input id="zip" class="form-control" formControlName="zip" placeholder="Zipcode" />
      </div>
      <div class="col-md-6 mb-3">
        <label for="country" class="form-label">Country</label>
        <input id="country" class="form-control" formControlName="country" placeholder="Country" />
      </div>
    </div>
  
    <h3 class="mt-4 mb-3">Review Your Order</h3>
      <h6>Total Quantity:{{cartQuantity}} </h6>
       <h6>Shipping: FREE</h6>
       <H6>Total price:{{cartTotal}}</H6>
    <button type="submit" class="btn btn-success w-100" [disabled]="checkoutForm.invalid">
      Purchase
    </button>
  </form>
</div>
