<div class="container" style="margin-top: 100px;">
    <h2>Your Shopping Cart</h2>
  
    <div *ngIf="cartItems.length === 0" class="alert alert-warning">
      Your cart is empty.
    </div>
  
    <div class="row fw-bold text-white bg-primary py-2">
      <div class="col-md-2">Product Image</div>
      <div class="col-md-3">Product Details</div>
      <div class="col-md-4">Quantity</div>
      <div class="col-md-3 text-end">Subtotal</div>
    </div>
  
    <div *ngFor="let item of cartItems" class="row mb-3 align-items-center">
      <div class="col-md-2">
        <img [src]="item.imageUrl" alt="{{ item.name }}" class="img-responsive" width="100">
      </div>
      <div class="col-md-3">
        <h5>{{ item.name }}</h5>
        <p>₹{{ item.unitPrice }}</p>
      </div>
      <div class="col-md-4">
        <div class="input-group">
          <button class="btn btn-outline-secondary" (click)="decrement(item)">-</button>
          <input type="text" class="form-control text-center" [value]="item.quantity" readonly>
          <button class="btn btn-outline-secondary" (click)="increment(item)">+</button>
          <button class="btn btn-danger ms-2" (click)="remove(item)">Remove</button>
        </div>
      </div>
      <div class="col-md-3 text-end">
        <p>₹{{ item.unitPrice * item.quantity }}</p>
      </div>
    </div>
  
    <hr>
    <div class="row fw-bold">
      <div class="col-md-9 text-end">
        <h4>Total ({{ totalQuantity }} items):</h4>
      </div>
      <div class="col-md-3 text-end">
        <h4>₹{{ totalPrice }}</h4>
      </div>
    </div>
    <div class="text-end mt-3">
      <button class="btn btn-primary" routerLink="/checkout">Proceed to Checkout</button>
    </div>
  </div>
