<div *ngFor="let s of students">

  <div class="container" *ngIf="s.stuAge > 21">

    <hr>
    <h3>{{s.stuName}}</h3>
    <h3>{{s.stuAge}}</h3>
    <h3>{{s.gender}}</h3>
    <h3>{{s.address}}</h3>
    <h3>{{s.appName}}</h3>
    <h3>{{s.phName}}</h3>
    <h3>{{s.room}}</h3>

    <hr>
  </div>

</div>
